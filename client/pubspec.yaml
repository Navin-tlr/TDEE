name: client
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Dependencies for Firebase and Riverpod
  firebase_core: ^3.2.0
  cloud_firestore: ^5.1.0
  flutter_riverpod: ^2.5.1
  firebase_auth: ^5.1.1
  http: ^1.2.1

  # Add these lines for charting and date formatting
  fl_chart: ^0.68.0
  intl: ^0.19.0 # <--- ADD THIS LINE
  
  # Syncfusion Charts for better charting capabilities
  syncfusion_flutter_charts: ^30.2.4

  # Media and sensors for hero video and parallax
  video_player: ^2.8.6
  sensors_plus: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true